<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6"><title>无声铃鹿的午后桌边</title>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/suzuka-32.png?v=2">
<link rel="apple-touch-icon" type="image/png" sizes="180x180" href="assets/icons/suzuka-180.png?v=2">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="gallery.css"><link rel="stylesheet" href="folio.css">
<script type="module" src="app.js"></script>
</head>
<body data-scene="gate">
<main id="world" inert aria-label="铃鹿的午后桌边">
 <div id="desk" class="desk">
  <div id="plate" class="plate">
   <picture>
    <source media="(aspect-ratio < 28/25)" srcset="assets/desk/desk-portrait.webp">
    <source media="(aspect-ratio > 37/20)" srcset="assets/desk/desk-wide.webp">
    <img id="art" decoding="sync" src="assets/desk/desk-afternoon.webp" alt="花园的日光穿过窗帘，落在木桌与银色笔记本上。">
   </picture>
   <section id="screen" aria-label="桌上的 Codex 安装演示">
    <div class="cx-title"><button id="sidebarToggle" aria-label="切换侧栏" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="icons.svg#panel"></use></svg></button><svg class="icon" aria-hidden="true"><use href="icons.svg#prev"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg><span>文件</span><span>编辑</span><span>视图</span><span>帮助</span></div>
    <div class="cx-body">
     <div class="cx-rail" aria-hidden="true"><span class="rail-home"><svg class="icon" aria-hidden="true"><use href="icons.svg#home"></use></svg></span><svg class="icon" aria-hidden="true"><use href="icons.svg#thread"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#checklist"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#clock"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#more"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#folder"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#apps"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#sliders"></use></svg><span class="rail-foot"><svg class="icon" aria-hidden="true"><use href="icons.svg#gear"></use></svg></span></div>
     <aside class="cx-side" id="sidebar" aria-label="Codex 侧栏">
      <div class="sidebar-top"><strong>Codex</strong><svg class="icon" aria-hidden="true"><use href="icons.svg#down"></use></svg><span></span><svg class="icon" aria-hidden="true"><use href="icons.svg#filter"></use></svg><svg class="icon" aria-hidden="true"><use href="icons.svg#search"></use></svg></div>
      <div class="sidebar-scroll"><div class="side-row"><svg class="icon" aria-hidden="true"><use href="icons.svg#write"></use></svg>新聊天</div>
      <button class="side-row pet-row" id="installedPet" hidden><canvas id="sidebarPet" width="96" height="104"></canvas>Suzuka</button>
      <div class="folders"><div><svg class="icon" aria-hidden="true"><use href="icons.svg#shoe"></use></svg>桌宠制作<svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg></div><div><svg class="icon" aria-hidden="true"><use href="icons.svg#palette"></use></svg>创作与设计<svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg></div><div><svg class="icon" aria-hidden="true"><use href="icons.svg#leaf"></use></svg>日常与微风<svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg></div><div><svg class="icon" aria-hidden="true"><use href="icons.svg#folder"></use></svg>待归档<svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg></div></div>
      <div class="side-project">项目 <svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg></div><div class="side-recent">最近</div>
      <div class="recent-list"><span>午后桌面 · 无声铃鹿</span><span>核对 sprite v2 图集清单</span><span>运动服半身 v1.3 打包</span><span>胜负服全身立绘核对</span></div></div>
     </aside>
     <section class="cx-main" aria-label="Codex 对话">
      <div id="log" class="thread-scroll" role="log"><div id="welcome"><div id="drop"><svg class="icon" aria-hidden="true"><use href="icons.svg#codex"></use></svg><b>我们要构建什么？</b><div class="invite-line"><span id="dragHint">将桌边的铃鹿拖入此窗口安装</span><button id="invite" aria-label="直接邀请铃鹿入座">直接邀请</button></div></div></div></div>
      <div class="composer"><div class="composer-context"><span><svg class="icon" aria-hidden="true"><use href="icons.svg#laptop"></use></svg>此计算机</span><span><svg class="icon" aria-hidden="true"><use href="icons.svg#folder"></use></svg>选择项目</span></div>
       <div class="composer-card"><div id="compose" role="status">随心输入</div><div class="compose-tools"><button class="attach" id="attachPackage" aria-label="附加当前装束的 ZIP" title="附加当前装束的 ZIP"><svg class="icon" aria-hidden="true"><use href="icons.svg#plus"></use></svg></button><span class="access">完全访问</span><span class="composer-model"><svg class="icon" aria-hidden="true"><use href="icons.svg#bolt"></use></svg>GPT-6.2 Astra <em>Ultra</em></span><svg class="icon" aria-hidden="true"><use href="icons.svg#mic"></use></svg><button class="send" id="sendPrompt" aria-label="发送安装指令" title="发送安装指令"><svg class="icon" aria-hidden="true"><use href="icons.svg#sound"></use></svg></button></div></div>
      </div>
     </section>
    </div>
   </section>
  </div>
  <svg id="guide" aria-hidden="true"><path id="guideLine"/><path id="guideHead"/><circle id="guideTarget"/></svg>
  <div id="pet" class="pet"><button id="petGrip" aria-label="桌边的铃鹿，轻点打招呼，也可拖入 Codex"><canvas id="petCanvas" width="576" height="624"></canvas></button><span class="whisper" id="whisper" role="status"></span></div>
  <div class="nameplate"><span class="seal"><svg class="icon" aria-hidden="true"><use href="icons.svg#shoe"></use></svg></span><span><b>无声铃鹿</b><i>Silence Suzuka</i></span></div>
  <div class="desk-dock"><button id="outfitDesk" class="ribbon" aria-label="换装，当前为运动服半身"><span class="sewn"><svg class="icon" aria-hidden="true"><use href="icons.svg#hanger"></use></svg><span>换装 · <span class="outfit-label">运动服半身</span></span><svg class="icon" aria-hidden="true"><use href="icons.svg#swap"></use></svg></span></button><button class="gallery-link" id="galleryLink" hidden><svg class="icon" aria-hidden="true"><use href="icons.svg#cards"></use></svg> 动作手札</button></div>
 </div>
 <div id="dust" aria-hidden="true"></div>
 <section id="gallery" aria-label="动作手札" hidden>
  <button id="backDesk" class="quiet-nav"><svg class="icon" aria-hidden="true"><use href="icons.svg#back"></use></svg> 重回桌边</button>
  <div class="gallery-body">
    <div class="album-heading"><span class="album-rule"></span><svg class="icon" aria-hidden="true"><use href="icons.svg#shoe"></use></svg><h1>铃鹿的动作手札</h1><span class="album-rule"></span></div>
    <div class="spot-wrap"><button id="previousCard" aria-label="上一张动作卡"><svg class="icon" aria-hidden="true"><use href="icons.svg#prev"></use></svg></button><article id="spotlight">
      <div class="specimen" id="specimen"><div class="track-lines" aria-hidden="true"></div><canvas id="spotCanvas" width="576" height="624" aria-label="当前动作预览"></canvas></div>
      <div class="spot-copy"><div class="spot-folio"><span id="spotNo"></span><span> / 10</span></div><h2 id="spotTitle"></h2><p id="spotCaption"></p><div class="playback"><button id="pauseSpot" aria-label="暂停动作"><svg class="icon" aria-hidden="true"><use href="icons.svg#pause"></use></svg></button><div><span id="frameLabel"></span><div id="filmstrip" aria-hidden="true"></div></div></div></div>
    </article><button id="nextCard" aria-label="下一张动作卡"><svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg></button></div>
    <div id="fan" role="group" aria-label="十张动作手牌"></div>
  </div>
  <div class="gallery-dock"><button id="redeal"><img src="assets/official/uma-jewel-cutout.png" alt="">重新发牌</button><div class="segments" id="outfitGallery" role="group" aria-label="装束切换"><button data-outfit-choice="half" aria-pressed="true">运动服半身</button><button data-outfit-choice="full" aria-pressed="false">胜负服全身</button></div><button id="takeHome"><svg class="icon" aria-hidden="true"><use href="icons.svg#download"></use></svg><span>带走这只铃鹿<span class="dock-long"> · 下载与安装</span></span></button></div>
 </section>
 <section id="folio" hidden aria-labelledby="downloadTitle">
  <button id="folioBack" class="quiet-nav"><svg class="icon" aria-hidden="true"><use href="icons.svg#back"></use></svg><span>返回午后桌边</span></button>
  <div class="folio-scroll"><article class="folio-sheet">
   <figure class="folio-portrait">
    <div class="portrait-mount"><span class="portrait-rules" aria-hidden="true"></span><canvas id="folioPet" width="576" height="624" aria-label="所选装束的铃鹿动态预览"></canvas></div>
    <figcaption><strong>无声铃鹿</strong><i lang="en">Silence Suzuka</i><span id="packageTitle"></span></figcaption>
   </figure>
   <div class="folio-entry">
    <header><img src="assets/official/uma-jewel-cutout.png" alt=""><h1 id="downloadTitle">桌宠收养单</h1></header>
    <p class="folio-intro">下载便携包，或将安装指令交给你的 Agent。</p>
    <div class="download-outfits segments" role="group" aria-label="选择下载装束"><button data-form="half">运动服半身 v1.3</button><button data-form="full">胜负服全身 v1.3</button></div>
    <div class="package"><span><svg class="icon" aria-hidden="true"><use href="icons.svg#box"></use></svg> PetDex sprite v2</span><small>1536 × 2288 px</small></div>
    <a id="zip" class="zip" download><svg class="icon" aria-hidden="true"><use href="icons.svg#download"></use></svg> 下载 ZIP</a><small id="packageFile"></small>
    <label class="activation"><input id="activate" type="checkbox" checked>安装后设为当前桌宠</label>
    <button id="copyPrompt"><svg class="icon" aria-hidden="true"><use href="icons.svg#copy"></use></svg> <span>复制 Agent 安装指令</span></button>
    <details id="promptDetails"><summary>查看并编辑完整安装指令</summary><textarea id="promptText" aria-label="Agent 安装指令" spellcheck="false"></textarea></details>
   </div>
  </article></div>
 </section>
 <div class="music" id="music"><button id="directDownload" aria-label="下载安装"><svg class="icon" aria-hidden="true"><use href="icons.svg#download"></use></svg>下载安装</button><div class="music-pill"><button id="playMusic" aria-label="播放音乐"><svg class="icon" aria-hidden="true"><use href="icons.svg#play"></use></svg></button><button id="trackMenu" aria-expanded="false" aria-controls="tracks"><span id="trackName">Silent Star</span><svg class="icon" aria-hidden="true"><use href="icons.svg#down"></use></svg></button></div><div id="tracks" hidden><button data-track="0">Silent Star</button><button data-track="1">Endless Dream</button></div></div>
</main>
<section id="gate" aria-label="音乐选择"><div class="gate-center"><div class="choices" id="choices" data-choice="on"><button id="musicOn">开启音乐</button><button id="musicOff">关闭音乐</button><div class="jewel-track"><img alt="" src="assets/official/uma-jewel-cutout.png"></div></div><p id="hint" role="status"><span class="loading-dot"></span> 正在准备午后桌面</p></div></section>
<noscript>打开 JavaScript 即可进入午后桌面，与铃鹿互动。</noscript>
</body></html>
